name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
    name: PHP ${{ matrix.php }} + Node
    steps:
      - uses: actions/checkout@v7
        with:
          # The detector's fixtures build their own repos, but the CLI's
          # default --from walks this repo's tags.
          fetch-depth: 0

      # Third-party dependency allowlist, fetched (never vendored), pinned by
      # commit SHA and content hash. Re-pin with
      # .ai/tools/pin-github-checks.mjs in the envelope, never by hand.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The detector: zero dependencies, so no install step. Must-fire and
      # must-not-fire fixture repos per class, plus the PHP-signed decision
      # record verified in Node.
      - name: Detector tests (node --test)
        run: node --test "council/test/*.test.mjs"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, dom, zip, pdo_sqlite, sodium
        env:
          update: true # latest patch, not the runner's preinstalled one
      - name: Floor PHP at the PHP2Shell-patched release (CVE-2026-109618/109619)
        run: php -r '$v=$argv[1]??PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION; $f=["8.5"=>"8.5.12","8.4"=>"8.4.27","8.3"=>"8.3.36","8.2"=>"8.2.35"][implode(".",array_slice(explode(".",$v),0,2))]??(version_compare($v,"8.6",">=")?"8.6":"8.2.35"); if(version_compare($v,$f,"<")){echo "::error::PHP $v is below the PHP2Shell floor $f".PHP_EOL;exit(1);} echo "PHP $v >= PHP2Shell floor $f".PHP_EOL;'

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Hermetic: in-memory SQLite and a fake petition transport. Nothing
      # reaches Genie or the network.
      - name: Ledger tests (Pest)
        run: vendor/bin/pest --colors=always

      - name: Lint
        run: php tests/lint.php

      - name: Validate Composer manifest
        run: composer validate --strict

      # Phase 1 dogfood: this repo's own release, reported, never failing.
      - name: Change report (report-only)
        run: node council/check.mjs --repo . --out council-report.json

  # Rulesets require the literal "build" check.
  build:
    name: build
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
